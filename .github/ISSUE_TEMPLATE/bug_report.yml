name: Bug report
description: Report a reproducible defect in Invoxa.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include real invoices, credentials, or personal data. For security vulnerabilities, use the private advisory process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the API and worker
        2. Upload fixtures/acme_invoice.pdf
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The commit SHA, tag, or branch you tested.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / tenancy
        - Upload / OCR / extraction
        - Review / approval
        - Exports
        - API keys
        - Webhooks
        - Frontend
        - Deployment / Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and customer data before pasting logs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and real customer data from this report.
          required: true
        - label: I searched existing issues for a duplicate.
          required: true
